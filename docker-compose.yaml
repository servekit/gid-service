# Generated by service-docker-scaffold. Edit the skill inputs and rerender
# instead of hand-merging dependency files.

services:
  gid-service:
    image: ${IMAGE_REPOSITORY:-gid-service}:${IMAGE_TAG:-latest}
    build:
      context: "."
      dockerfile: "Dockerfile"
      # Override GOPROXY in .env (e.g. GOPROXY=https://goproxy.cn,direct) when
      # proxy.golang.org is unreachable from the build host.
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      - GID_SERVICE_SERVER_GRPC_ADDR=${GID_SERVICE_SERVER_GRPC_ADDR:-:19091}
      - GID_SERVICE_SERVER_HTTP_ADDR=${GID_SERVICE_SERVER_HTTP_ADDR:-:18081}
      - GID_SERVICE_LOG_LEVEL=${GID_SERVICE_LOG_LEVEL:-info}
      - GID_SERVICE_CRON_OVERLAP_POLICY=${GID_SERVICE_CRON_OVERLAP_POLICY:-}
      - GID_SERVICE_CRON_TIMEZONE=${GID_SERVICE_CRON_TIMEZONE:-}
      - GID_SERVICE_LOG_FORMAT=${GID_SERVICE_LOG_FORMAT:-json}
      - GID_SERVICE_SNOWFLAKE_MACHINE_ID=${GID_SERVICE_SNOWFLAKE_MACHINE_ID:-1}
      - GID_SERVICE_SNOWFLAKE_START_TIME=${GID_SERVICE_SNOWFLAKE_START_TIME:-2026-01-01T00:00:00Z}
      - GID_SERVICE_VAR=${GID_SERVICE_VAR:-}
    ports:
      - "${HOST_GRPC_PORT:-19091}:19091"
      - "${HOST_HTTP_PORT:-18081}:18081"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:19091", "-connect-timeout=2s"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      retries: ${HEALTHCHECK_RETRIES:-6}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}




