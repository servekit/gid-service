syntax = "proto3";

package gid.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// Pong is the health-check response — only public, non-sensitive info
// (service name, version, git/build info, timestamps). Never include internal
// addresses, IPs, env vars, secrets, or dependency topology here.
message Pong {
  string service = 1;       // service name, e.g. "gid-service"
  string version = 2;       // semantic version (ldflags; "dev" by default)
  string git_commit = 3;    // short commit hash (ldflags or VCS-embedded)
  string git_branch = 4;    // git branch (ldflags)
  string build_time = 5;    // build time, RFC3339 UTC (ldflags)
  string go_version = 6;    // Go toolchain version (runtime, not injected)
  string status = 7;        // "SERVING" when serving normally
  int64 now = 8;            // server time, Unix millis
  int64 started_at = 9;     // process start time, Unix millis (uptime)
}

// GidService provides global unique ID generation based on Sonyflake.
service GidService {
  rpc Ping(google.protobuf.Empty) returns (Pong) {
    option (google.api.http) = { get: "/ping" };
  }

  // NextID generates a single unique ID.
  rpc NextID(NextIDRequest) returns (NextIDResponse) {
    option (google.api.http) = {get: "/v1/gid/next"};
  }

  // BatchNextID generates multiple unique IDs.
  rpc BatchNextID(BatchNextIDRequest) returns (BatchNextIDResponse) {
    option (google.api.http) = {
      post: "/v1/gid/batch"
      body: "*"
    };
  }

  // Decompose parses an ID into its components.
  rpc Decompose(DecomposeRequest) returns (DecomposeResponse) {
    option (google.api.http) = {get: "/v1/gid/decompose/{id}"};
  }
}

message NextIDRequest {}

message NextIDResponse {
  int64 id = 1;
}

message BatchNextIDRequest {
  int32 count = 1 [(buf.validate.field).int32 = {gte: 1, lte: 1000}];
}

message BatchNextIDResponse {
  repeated int64 ids = 1;
}

message DecomposeRequest {
  int64 id = 1 [(buf.validate.field).int64 = {gte: 1}];
}

message DecomposeResponse {
  int64 time = 1;
  int64 sequence = 2;
  int64 machine_id = 3;
  string generated_at = 4; // ISO8601 timestamp
}
